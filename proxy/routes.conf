# omavm credential-injecting gateway routes.
#
# Format:  <path-prefix> <https-upstream> <header-name> <value-template>
#
# The value template may contain ${VAR} references, which are read from
# /etc/omavm/credentials.env at proxy start. A route whose variable is unset is
# disabled and logged at startup rather than forwarding an unauthenticated
# request.
#
# The guest points its client at http://192.168.100.1:8889/<prefix> over plain
# HTTP. The key is attached on the host and the request goes upstream over real
# TLS. The guest never holds the key, so an agent that reads every file and
# environment variable in its own VM still cannot exfiltrate it.
#
# Any Authorization, X-Api-Key, Api-Key or Cookie header sent by the guest is
# stripped before the request is forwarded.
#
# After editing:  sudo systemctl reload omavm-agent-proxy

/anthropic  https://api.anthropic.com  x-api-key      ${ANTHROPIC_API_KEY}
# /openai   https://api.openai.com     Authorization  Bearer ${OPENAI_API_KEY}
