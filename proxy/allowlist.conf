# omavm egress allowlist.
#
# Format:  <host> [port[,port...]]
# Port defaults to 443 when omitted. A leading *. matches subdomains only,
# so "*.example.com" matches "api.example.com" but not "example.com" itself.
#
# This file is DEFAULT DENY. An empty file means the guest reaches nothing.
# That is the intended starting state. Add entries only when a specific agent
# task actually needs them, one host at a time.
#
# Two things this cannot do, by design:
#   * It cannot restrict paths or methods. Allowing a host allows the whole
#     host. Prefer a gateway route in routes.conf when you want the guest to
#     reach exactly one API with a credential it never sees.
#   * It cannot distinguish two sites behind the same CDN hostname. It matches
#     the name the guest asked for, which is the name in the TLS SNI.
#
# After editing:  sudo systemctl reload omavm-agent-proxy
# To validate first:
#   sudo -u omavm-proxy /usr/local/lib/omavm/agent-proxy.py --check
#
# See OPERATIONS.md, "An agent is blocked by the proxy".

# --- examples, all commented out on purpose --------------------------------
# api.anthropic.com 443
# github.com 443
# *.githubusercontent.com 443
# geo.mirror.pkgbuild.com 443
