# omavm shared configuration.
# Sourced by install_host_deps.sh, manage-agent-vm.sh and verify-isolation.sh.
# Every path and name used by the toolkit is derived from this file.

# --- identity -----------------------------------------------------------
VM_NAME="omarchy-agent"
GUEST_USER="agent"                 # the user account you create during the Omarchy install
GUEST_MAC="52:54:00:a9:e1:10"      # pinned so DHCP reservations are stable across resets

# --- storage ------------------------------------------------------------
IMAGE_DIR="/var/lib/libvirt/images/omavm"
BASE_IMAGE="${IMAGE_DIR}/${VM_NAME}-base.qcow2"      # read-only golden image
WORK_IMAGE="${IMAGE_DIR}/${VM_NAME}-build.qcow2"     # writable image used only during build
OVERLAY_IMAGE="${IMAGE_DIR}/${VM_NAME}-overlay.qcow2" # COW overlay, discarded on every reset
DISK_SIZE="60G"

# --- firmware -----------------------------------------------------------
OVMF_CODE="/usr/share/edk2/x64/OVMF_CODE.4m.fd"
OVMF_VARS_TEMPLATE="/usr/share/edk2/x64/OVMF_VARS.4m.fd"
NVRAM_FILE="/var/lib/libvirt/qemu/nvram/${VM_NAME}_VARS.fd"

# --- guest sizing -------------------------------------------------------
VM_MEM_MB="8192"
VM_VCPUS="6"

# --- graphics -----------------------------------------------------------
# Render node used for virgl. Confirm with: ls -l /dev/dri/renderD*
RENDER_NODE="/dev/dri/renderD128"

# --- sandbox network (isolated, no route to anywhere) -------------------
SANDBOX_NET="agent-sandbox-net"
SANDBOX_BRIDGE="virbr-agent"
SANDBOX_SUBNET="192.168.100.0/24"
HOST_IP="192.168.100.1"
GUEST_IP="192.168.100.10"

# --- build network (NAT, used only while installing or updating) --------
BUILD_NET="agent-build-net"
BUILD_BRIDGE="virbr-build"
BUILD_HOST_IP="192.168.101.1"
BUILD_GUEST_IP="192.168.101.10"

# --- proxy --------------------------------------------------------------
PROXY_PORT="8888"        # HTTPS CONNECT proxy, hostname allowlist
GATEWAY_PORT="8889"      # credential-injecting reverse proxy for LLM APIs
PROXY_ALLOWLIST="/etc/omavm/allowlist.conf"
PROXY_ROUTES="/etc/omavm/routes.conf"
PROXY_CREDENTIALS="/etc/omavm/credentials.env"
PROXY_LOG="/var/log/omavm/agent-proxy.log"

# --- ssh ----------------------------------------------------------------
SSH_KEY="${HOME}/.ssh/omavm_agent_ed25519"
SSH_OPTS="-o UserKnownHostsFile=${HOME}/.ssh/known_hosts_omavm -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5"

# --- installer media ----------------------------------------------------
# Set this to the Omarchy ISO you downloaded, or pass --iso to the build command.
OMARCHY_ISO="${HOME}/Downloads/omarchy.iso"
