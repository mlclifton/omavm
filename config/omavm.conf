# omavm shared configuration.
#
# Everything here is shared by every VM. Anything that differs per VM is
# derived from the VM name at run time, or set in config/vm/<name>.conf.
#
# Sourced by install_host_deps.sh, manage-agent-vm.sh and verify-isolation.sh.

# --- profile ------------------------------------------------------------
# workstation  A second Omarchy desktop for agent-driven UI work. Real
#              internet, clipboard sharing, optional file sharing. The agent
#              is trusted about as much as you are. This is the default.
#
# sandbox      Containment for something you do not trust. Isolated network
#              with no route out, no DNS, no clipboard, no file sharing, and
#              egress only through the host proxy. See OPERATIONS.md.
PROFILE="${OMAVM_PROFILE:-workstation}"

# --- storage ------------------------------------------------------------
# One base image, shared by every VM. Each VM is a copy-on-write overlay of
# it, so a new VM costs a few hundred kilobytes rather than another 60G.
IMAGE_DIR="/var/lib/libvirt/images/omavm"
BASE_IMAGE="${IMAGE_DIR}/omarchy-base.qcow2"
NVRAM_DIR="/var/lib/libvirt/qemu/nvram"
DISK_SIZE="60G"

# --- firmware -----------------------------------------------------------
OVMF_CODE="/usr/share/edk2/x64/OVMF_CODE.4m.fd"
OVMF_VARS_TEMPLATE="/usr/share/edk2/x64/OVMF_VARS.4m.fd"

# --- guest sizing -------------------------------------------------------
# Defaults for a new VM. Override per VM in config/vm/<name>.conf.
#
# Sized so three VMs fit alongside the host. Memory is the binding constraint
# on how many you can run at once, not disk: the shared base means disk barely
# moves per VM.
VM_MEM_MB="6144"
VM_VCPUS="4"

# --- graphics -----------------------------------------------------------
RENDER_NODE="/dev/dri/renderD128"

# Guest resolution, baked into the EDID the virtual GPU presents.
#
# Keep this fixed. An agent clicking at coordinates needs the viewport to be
# the same size on every run, and screenshots are only comparable across runs
# if the geometry does not move.
VIDEO_WIDTH="1920"
VIDEO_HEIGHT="1080"

# --- file sharing -------------------------------------------------------
# A per-VM directory under here is shared into that VM at SHARE_MOUNT, if the
# directory exists. Nothing is shared unless you create it, and the sandbox
# profile ignores it entirely.
#
# Empty disables sharing for every VM.
SHARE_ROOT="${OMAVM_SHARE_ROOT-${HOME}/Projects/omavm-share}"
SHARE_TAG="omavm"
SHARE_MOUNT="/mnt/omavm"
SHARE_READONLY="${OMAVM_SHARE_READONLY:-no}"

# --- naming -------------------------------------------------------------
# VM names must match this. Keeping them short, lower case and unambiguous
# stops a name being mistaken for a command or a flag, and keeps the derived
# hostname and file names predictable.
VM_NAME_PATTERN='^[a-z][a-z0-9-]{0,19}$'

# The writable guest that produces the shared base image. Reserved: the build
# and seal commands accept this name and no other.
BASE_VM="base"

# --- networks -----------------------------------------------------------
# Two definitions, one active at a time, on separate subnets so they can both
# be defined without colliding. DHCP reservations are added per VM and are the
# registry of which VMs exist.
WORKSTATION_NET="agent-net"
WORKSTATION_BRIDGE="virbr-agent"
WORKSTATION_SUBNET="192.168.100.0/24"
WORKSTATION_HOST_IP="192.168.100.1"

SANDBOX_NET="agent-sandbox-net"
SANDBOX_BRIDGE="virbr-sandbox"
SANDBOX_SUBNET="192.168.101.0/24"
SANDBOX_HOST_IP="192.168.101.1"

# Addresses handed to VMs, within the DHCP range declared in the network XML.
GUEST_IP_FIRST="10"
GUEST_IP_LAST="99"

case "$PROFILE" in
    workstation)
        VM_NET="$WORKSTATION_NET"
        VM_BRIDGE="$WORKSTATION_BRIDGE"
        HOST_IP="$WORKSTATION_HOST_IP"
        ;;
    sandbox)
        VM_NET="$SANDBOX_NET"
        VM_BRIDGE="$SANDBOX_BRIDGE"
        HOST_IP="$SANDBOX_HOST_IP"
        ;;
    *)
        echo "omavm: unknown PROFILE '$PROFILE'. Use 'workstation' or 'sandbox'." >&2
        return 1 2>/dev/null || exit 1
        ;;
esac
NET_PREFIX="${HOST_IP%.*}"

# --- proxy (sandbox profile only) ---------------------------------------
PROXY_PORT="8888"
GATEWAY_PORT="8889"
PROXY_ALLOWLIST="/etc/omavm/allowlist.conf"
PROXY_ROUTES="/etc/omavm/routes.conf"
PROXY_CREDENTIALS="/etc/omavm/credentials.env"
PROXY_LOG="/var/log/omavm/agent-proxy.log"

# --- ssh ----------------------------------------------------------------
# One keypair for every VM. They are all overlays of the same base, so they
# share its authorized_keys and its host keys.
GUEST_USER="omadev"
SSH_KEY="${HOME}/.ssh/omavm_agent_ed25519"
SSH_OPTS="-o UserKnownHostsFile=${HOME}/.ssh/known_hosts_omavm -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5"

# --- keyboard -----------------------------------------------------------
# The layout the GUEST is configured for. Used only by the paste command,
# which types at the virtual keyboard and has to know which physical key
# carries which symbol. Supported: us, gb.
KEYBOARD_LAYOUT="${OMAVM_KEYBOARD_LAYOUT:-gb}"

# --- installer media ----------------------------------------------------
OMARCHY_ISO="${HOME}/Downloads/omarchy.iso"
