# omavm shared configuration.
# Sourced by install_host_deps.sh, manage-agent-vm.sh and verify-isolation.sh.

# --- profile ------------------------------------------------------------
# workstation  A second Omarchy desktop for agent-driven UI work. Real
#              internet, clipboard sharing, optional file sharing. The agent
#              is trusted about as much as you are. This is the default.
#
# sandbox      Containment for something you do not trust. Isolated network
#              with no route out, no DNS, no clipboard, no file sharing, and
#              egress only through the host proxy. See OPERATIONS.md.
#
# The profile decides the network, the clipboard and whether sharing is even
# possible, so it is a single switch rather than a set of flags you have to
# keep consistent with each other.
PROFILE="${OMAVM_PROFILE:-workstation}"

# --- identity -----------------------------------------------------------
VM_NAME="omarchy-agent"
GUEST_USER="omadev"                # the account created during the Omarchy install
GUEST_MAC="52:54:00:a9:e1:10"      # pinned so DHCP reservations are stable

# --- storage ------------------------------------------------------------
IMAGE_DIR="/var/lib/libvirt/images/omavm"
BASE_IMAGE="${IMAGE_DIR}/${VM_NAME}-base.qcow2"
WORK_IMAGE="${IMAGE_DIR}/${VM_NAME}-build.qcow2"
OVERLAY_IMAGE="${IMAGE_DIR}/${VM_NAME}-overlay.qcow2"
DISK_SIZE="60G"

# --- firmware -----------------------------------------------------------
OVMF_CODE="/usr/share/edk2/x64/OVMF_CODE.4m.fd"
OVMF_VARS_TEMPLATE="/usr/share/edk2/x64/OVMF_VARS.4m.fd"
NVRAM_FILE="/var/lib/libvirt/qemu/nvram/${VM_NAME}_VARS.fd"

# --- guest sizing -------------------------------------------------------
VM_MEM_MB="12288"
VM_VCPUS="6"

# --- graphics -----------------------------------------------------------
RENDER_NODE="/dev/dri/renderD128"

# Guest resolution, baked into the EDID the virtual GPU presents.
#
# Keep this fixed. An agent clicking at coordinates needs the viewport to be
# the same size on every run, and screenshots are only comparable across runs
# if the geometry does not move. Letting the viewer window decide the size
# makes agent behaviour irreproducible.
VIDEO_WIDTH="1920"
VIDEO_HEIGHT="1080"

# --- keyboard ------------------------------------------------------------
# The layout the GUEST is configured for, which is whatever you chose during
# the Omarchy install. Used only by `manage-agent-vm.sh paste`, which types at
# the virtual keyboard and therefore has to know which physical key carries
# which symbol. Letters and digits are the same on every layout; punctuation is
# not, so a wrong value here shows up as the wrong symbols rather than an error.
# Supported: us, gb.
KEYBOARD_LAYOUT="${OMAVM_KEYBOARD_LAYOUT:-gb}"

# --- file sharing -------------------------------------------------------
# Empty means no share exists at all: no device, no mount, nothing to secure.
# Set a host directory to enable a virtiofs share. Ignored in the sandbox
# profile, where a shared filesystem would bypass the network controls.
#
# Share a purpose-made directory, not your home. The guest writes into it as
# the guest user, and anything in it is reachable by whatever runs in there.
# Overridable per command with OMAVM_SHARE_DIR, the same way OMAVM_PROFILE
# overrides the profile, so you can attach a share for one session without
# editing this file.
SHARE_DIR="${OMAVM_SHARE_DIR-}"
SHARE_TAG="omavm"                  # mount tag; guest mounts it at SHARE_MOUNT
SHARE_MOUNT="/mnt/omavm"
SHARE_READONLY="${OMAVM_SHARE_READONLY:-no}"   # yes makes the guest unable to write

# --- networks -----------------------------------------------------------
# Two definitions, one active at a time, on separate subnets so they can both
# be defined without colliding.
WORKSTATION_NET="agent-net"
WORKSTATION_BRIDGE="virbr-agent"
WORKSTATION_SUBNET="192.168.100.0/24"
WORKSTATION_HOST_IP="192.168.100.1"
WORKSTATION_GUEST_IP="192.168.100.10"

SANDBOX_NET="agent-sandbox-net"
SANDBOX_BRIDGE="virbr-sandbox"
SANDBOX_SUBNET="192.168.101.0/24"
SANDBOX_HOST_IP="192.168.101.1"
SANDBOX_GUEST_IP="192.168.101.10"

# Derived from the profile. Everything else refers to these.
case "$PROFILE" in
    workstation)
        VM_NET="$WORKSTATION_NET"
        VM_BRIDGE="$WORKSTATION_BRIDGE"
        HOST_IP="$WORKSTATION_HOST_IP"
        GUEST_IP="$WORKSTATION_GUEST_IP"
        ;;
    sandbox)
        VM_NET="$SANDBOX_NET"
        VM_BRIDGE="$SANDBOX_BRIDGE"
        HOST_IP="$SANDBOX_HOST_IP"
        GUEST_IP="$SANDBOX_GUEST_IP"
        ;;
    *)
        echo "omavm: unknown PROFILE '$PROFILE'. Use 'workstation' or 'sandbox'." >&2
        return 1 2>/dev/null || exit 1
        ;;
esac

# --- proxy (sandbox profile only) ---------------------------------------
PROXY_PORT="8888"
GATEWAY_PORT="8889"
PROXY_ALLOWLIST="/etc/omavm/allowlist.conf"
PROXY_ROUTES="/etc/omavm/routes.conf"
PROXY_CREDENTIALS="/etc/omavm/credentials.env"
PROXY_LOG="/var/log/omavm/agent-proxy.log"

# --- ssh ----------------------------------------------------------------
SSH_KEY="${HOME}/.ssh/omavm_agent_ed25519"
SSH_OPTS="-o UserKnownHostsFile=${HOME}/.ssh/known_hosts_omavm -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5"

# --- installer media ----------------------------------------------------
OMARCHY_ISO="${HOME}/Downloads/omarchy.iso"
